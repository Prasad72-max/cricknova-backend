<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#08090D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="novaAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E111A" />
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F59B" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF3366" flood-opacity="0.4" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00D2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="870" height="490" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Header Section -->
  <circle cx="50" cy="55" r="9" fill="url(#novaAurora)" />
  <text x="70" y="60" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1.5">BROKER NOVA • BILLION-DOLLAR COLOR PALETTE</text>
  <rect x="730" y="42" width="125" height="26" rx="13" fill="rgba(0, 210, 255, 0.1)" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1" />
  <text x="792" y="59" fill="#00D2FF" font-size="11" font-weight="600" text-anchor="middle">ULTRA LUXURY</text>

  <line x1="30" y1="85" x2="870" y2="85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- SWATCH 1: Cyber Emerald (Bull/Profit) -->
  <g transform="translate(40, 110)">
    <rect width="185" height="150" rx="12" fill="#0A0D14" stroke="rgba(0, 245, 155, 0.3)" stroke-width="1.2" />
    <rect x="15" y="15" width="155" height="65" rx="8" fill="#00F59B" filter="url(#glowGreen)" />
    <text x="92" y="52" fill="#000000" font-size="14" font-weight="800" text-anchor="middle">BUY +8.45%</text>
    <text x="15" y="105" fill="#FFFFFF" font-size="13" font-weight="600">Cyber Emerald</text>
    <text x="15" y="125" fill="#00F59B" font-size="12" font-family="monospace" font-weight="700">#00F59B</text>
    <text x="15" y="140" fill="#64748B" font-size="10">Bullish / Profit Glow</text>
  </g>

  <!-- SWATCH 2: Electric Crimson (Bear/Loss) -->
  <g transform="translate(250, 110)">
    <rect width="185" height="150" rx="12" fill="#0A0D14" stroke="rgba(255, 51, 102, 0.3)" stroke-width="1.2" />
    <rect x="15" y="15" width="155" height="65" rx="8" fill="#FF3366" filter="url(#glowRed)" />
    <text x="92" y="52" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">SELL -3.20%</text>
    <text x="15" y="105" fill="#FFFFFF" font-size="13" font-weight="600">Electric Crimson</text>
    <text x="15" y="125" fill="#FF3366" font-size="12" font-family="monospace" font-weight="700">#FF3366</text>
    <text x="15" y="140" fill="#64748B" font-size="10">Bearish / Loss Strike</text>
  </g>

  <!-- SWATCH 3: Nova Cyan (Ticker & Latency) -->
  <g transform="translate(460, 110)">
    <rect width="185" height="150" rx="12" fill="#0A0D14" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.2" />
    <rect x="15" y="15" width="155" height="65" rx="8" fill="#00D2FF" filter="url(#glowCyan)" />
    <text x="92" y="52" fill="#000000" font-size="14" font-weight="800" text-anchor="middle">⚡ 12ms TICK</text>
    <text x="15" y="105" fill="#FFFFFF" font-size="13" font-weight="600">Nova Cyan</text>
    <text x="15" y="125" fill="#00D2FF" font-size="12" font-family="monospace" font-weight="700">#00D2FF</text>
    <text x="15" y="140" fill="#64748B" font-size="10">Live Stream & Latency</text>
  </g>

  <!-- SWATCH 4: Nova Violet (AI & Intelligence) -->
  <g transform="translate(670, 110)">
    <rect width="185" height="150" rx="12" fill="#0A0D14" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.2" />
    <rect x="15" y="15" width="155" height="65" rx="8" fill="#6366F1" />
    <text x="92" y="52" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">🤖 NOVA AI</text>
    <text x="15" y="105" fill="#FFFFFF" font-size="13" font-weight="600">Electric Violet</text>
    <text x="15" y="125" fill="#818CF8" font-size="12" font-family="monospace" font-weight="700">#6366F1</text>
    <text x="15" y="140" fill="#64748B" font-size="10">AI Insights & Badges</text>
  </g>

  <!-- LOWER SECTION: Background Surfaces & Gradient Execution Bar -->
  <g transform="translate(40, 285)">
    <rect width="815" height="195" rx="12" fill="#090B10" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Title -->
    <text x="25" y="32" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="1">SURFACES & BRAND GRADIENT</text>

    <!-- Deep Obsidian Swatch -->
    <rect x="25" y="50" width="175" height="50" rx="8" fill="#08090D" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="40" y="73" fill="#FFFFFF" font-size="12" font-weight="600">Deep Obsidian</text>
    <text x="40" y="90" fill="#94A3B8" font-size="11" font-family="monospace">#08090D (Canvas)</text>

    <!-- Slate Glass Swatch -->
    <rect x="215" y="50" width="175" height="50" rx="8" fill="#0F121C" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="230" y="73" fill="#FFFFFF" font-size="12" font-weight="600">Slate Glass</text>
    <text x="230" y="90" fill="#94A3B8" font-size="11" font-family="monospace">#0F121C (Panels)</text>

    <!-- Elevated Surface Swatch -->
    <rect x="405" y="50" width="175" height="50" rx="8" fill="#181C2A" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="420" y="73" fill="#FFFFFF" font-size="12" font-weight="600">Elevated Surface</text>
    <text x="420" y="90" fill="#94A3B8" font-size="11" font-family="monospace">#181C2A (Modals)</text>

    <!-- Text Whites -->
    <rect x="595" y="50" width="195" height="50" rx="8" fill="#0E121D" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="610" y="71" fill="#FFFFFF" font-size="12" font-weight="700">Pure White #FFFFFF</text>
    <text x="610" y="90" fill="#94A3B8" font-size="11">Muted Slate #94A3B8</text>

    <!-- Execution Gradient Bar -->
    <text x="25" y="130" fill="#94A3B8" font-size="11" font-weight="600">NOVA AURORA CTA GRADIENT (#00D2FF ➔ #6366F1)</text>
    <rect x="25" y="142" width="765" height="38" rx="8" fill="url(#novaAurora)" />
    <text x="407" y="166" fill="#000000" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">INSTANT 1-CLICK ORDER EXECUTION • ULTRA LOW SLIPPAGE</text>
  </g>
</svg>